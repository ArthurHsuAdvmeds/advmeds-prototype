<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三軍總醫院北投分院｜精神健康個案通報管理儀表板</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="v3/">

<!--
  ============================================================================
  轉址頁：/tsghb-dashboard/ → 最新版儀表板
  ----------------------------------------------------------------------------
  這個檔案本身沒有內容，只負責把訪客導到最新版本目錄。
  各版本仍可獨立直接開啟：  v1/  v2/  v3/

  GitHub Pages 是純靜態託管，沒有伺服器端 rewrite，
  所以只能用「前端轉址」，三層保險：

    1. JS 自動偵測：從 LATEST 往後探測 v4、v5…，
       有就跳最新的那一版 → 發佈新版時這個檔案通常不必改
    2. 逾時保底：偵測若沒在 TIMEOUT_MS 內完成，直接跳 LATEST
    3. <noscript> meta refresh：完全沒有 JS 時仍會轉址

  網址全部用相對路徑，所以 GitHub Pages 子路徑
  （/advmeds-prototype/tsghb-dashboard/）和本機 file:// 直接開都能運作。

  發佈新版時：
    建好 v4/ 目錄後就會被自動偵測到，不需要改這裡。
    若想省掉那一次探測請求，把下面的 LATEST 改成 4 即可。
  ============================================================================
-->

<!-- 寫成 v3/index.html 而非 v3/：file:// 下目錄網址只會開出檔案列表 -->
<noscript><meta http-equiv="refresh" content="0; url=v3/index.html"></noscript>

<style>
  :root{ color-scheme: light dark; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    background:#fff;
    color:#242424;
  }
  @media (prefers-color-scheme:dark){
    body{ background:#16191d; color:#e6e8ea; }
  }
  .wrap{ text-align:center; padding:24px; }
  .spinner{
    width:34px; height:34px; margin:0 auto 18px;
    border:3px solid rgba(64,165,243,.25);
    border-top-color:#40a5f3;
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  @media (prefers-reduced-motion:reduce){ .spinner{ animation:none } }
  p{ margin:0; font-size:14px; opacity:.75; }
  .fallback{ margin-top:16px; font-size:13px; }
  a{ color:#238bd8; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner" role="status" aria-label="載入中"></div>
    <p>正在前往最新版儀表板…</p>
    <p class="fallback">沒有自動跳轉？<a id="manual" href="v3/index.html">請點此進入</a></p>
  </div>

<script>
(function(){
  "use strict";

  var LATEST      = 3;    /* 目前已知的最新版本號 */
  var PROBE_AHEAD = 3;    /* 往後最多探測幾版（v4、v5、v6） */
  var TIMEOUT_MS  = 1200; /* 偵測逾時就直接跳 LATEST，避免卡在這頁 */

  /* http(s) 下用乾淨的目錄網址（v3/）；
     file:// 下瀏覽器不會自動載入目錄裡的 index.html，只會列出檔案，
     所以本機直接開檔時必須補上完整檔名。 */
  var SUFFIX = (location.protocol === "file:") ? "index.html" : "";

  function urlFor(n){ return "v" + n + "/" + SUFFIX; }

  var target = urlFor(LATEST);
  var settled = false;

  document.getElementById("manual").href = target;

  function go(){
    if(settled) return;
    settled = true;
    /* replace 而非 assign：不留一筆歷史紀錄，返回鍵才不會彈回這頁 */
    location.replace(target);
  }

  var timer = setTimeout(go, TIMEOUT_MS);

  function finish(){ clearTimeout(timer); go(); }

  /* 往後逐版探測，找到存在的就更新 target，直到某一版不存在為止 */
  function probe(n){
    if(n > LATEST + PROBE_AHEAD){ finish(); return; }
    fetch("v" + n + "/index.html", { method:"HEAD", cache:"no-store" })
      .then(function(res){
        if(res.ok){
          target = urlFor(n);
          document.getElementById("manual").href = target;
          probe(n + 1);
        }else{
          finish();
        }
      })
      .catch(finish);   /* file:// 或離線時 fetch 會 reject，直接用 LATEST */
  }

  probe(LATEST + 1);
})();
</script>
</body>
</html>

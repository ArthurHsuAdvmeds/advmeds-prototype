<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowScript 流程圖編輯器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --line:#e4e7ec; --line-strong:#d0d5dd;
    --ink:#101828; --ink-2:#475467; --ink-3:#98a2b3;
    --accent:#2563eb; --accent-soft:#eff6ff;
    --danger:#d92d20; --danger-soft:#fef3f2;
    --warn:#b54708; --warn-soft:#fffaeb;
    --ok:#067647; --ok-soft:#ecfdf3;
    --mono:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  code,pre,textarea{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- header ---------- */
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:0 16px;height:56px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:baseline;gap:8px;margin-right:4px}
  .brand b{font-size:15px;letter-spacing:.2px}
  .brand span{font-size:12px;color:var(--ink-3)}
  .tabs{display:flex;gap:2px;background:#f2f4f7;padding:3px;border-radius:9px}
  .tabs a{
    font-size:13px;text-decoration:none;color:var(--ink-2);padding:5px 12px;border-radius:7px;
  }
  .tabs a.on{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(16,24,40,.08)}
  .spacer{flex:1}
  button.btn{
    font-family:inherit;font-size:13px;color:var(--ink-2);background:var(--panel);
    border:1px solid var(--line-strong);border-radius:8px;padding:7px 12px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  button.btn:hover{background:#f9fafb;color:var(--ink)}
  button.btn:active{transform:translateY(1px)}
  button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  button.btn.primary:hover{background:#1d4ed8;color:#fff}
  button.icon{padding:7px 9px;font-size:14px;line-height:1}

  /* ---------- layout ---------- */
  main{flex:1;display:grid;grid-template-columns:min(46%,560px) 6px 1fr;min-height:0}
  section{min-width:0;min-height:0;display:flex;flex-direction:column}
  #divider{cursor:col-resize;background:transparent;position:relative}
  #divider::after{content:"";position:absolute;inset:0 2px;background:var(--line);border-radius:2px}
  #divider:hover::after{background:var(--line-strong)}

  /* ---------- editor ---------- */
  .pane-head{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--line);
    font-size:12px;color:var(--ink-3);letter-spacing:.3px;
  }
  .pane-head b{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.4px}
  #editorWrap{
    flex:1;display:flex;min-height:0;background:var(--panel);
    border-right:1px solid var(--line);position:relative;
  }
  #gutter{
    flex:0 0 46px;padding:14px 8px 14px 0;text-align:right;overflow:hidden;
    font-family:var(--mono);font-size:12.5px;line-height:21px;color:var(--ink-3);
    background:#fbfcfd;border-right:1px solid var(--line);user-select:none;
  }
  #gutter div.bad{color:var(--danger);font-weight:600}
  #src{
    flex:1;border:0;outline:0;resize:none;padding:14px 14px 14px 12px;
    font-family:var(--mono);font-size:13px;line-height:21px;color:var(--ink);
    background:var(--panel);tab-size:2;white-space:pre;overflow:auto;
    font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;
  }
  #issues{
    flex:0 0 auto;max-height:32%;overflow:auto;border-top:1px solid var(--line);
    background:var(--panel);border-right:1px solid var(--line);padding:8px 10px;
    font-size:12.5px;line-height:1.6;
  }
  .issue{display:flex;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer}
  .issue:hover{background:#f9fafb}
  .issue .ln{
    flex:0 0 auto;font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:4px;
    background:#f2f4f7;color:var(--ink-2);height:fit-content;
  }
  .issue.err .ln{background:var(--danger-soft);color:var(--danger)}
  .issue.warn .ln{background:var(--warn-soft);color:var(--warn)}
  .issue.ok{cursor:default;color:var(--ok)}
  .issue.ok .ln{background:var(--ok-soft);color:var(--ok)}

  /* ---------- preview ---------- */
  #preview{background:var(--bg)}
  #canvasWrap{flex:1;position:relative;min-height:0;overflow:hidden}
  #canvas{position:absolute;inset:0}
  #canvas svg{display:block;width:100%;height:100%}
  .float-tools{
    position:absolute;right:14px;bottom:14px;display:flex;gap:6px;
    background:var(--panel);padding:6px;border-radius:10px;
    border:1px solid var(--line);box-shadow:0 4px 14px rgba(16,24,40,.08);
  }
  .hint{
    position:absolute;left:14px;bottom:16px;font-size:11.5px;color:var(--ink-3);
    background:rgba(255,255,255,.8);padding:4px 8px;border-radius:6px;
  }

  /* ---------- modal ---------- */
  .mask{
    position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;
    align-items:center;justify-content:center;padding:24px;z-index:20;
  }
  .mask.on{display:flex}
  .modal{
    background:var(--panel);border-radius:14px;width:min(880px,100%);max-height:100%;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(16,24,40,.25);
  }
  .modal header{border-bottom:1px solid var(--line);height:54px}
  .modal .body{overflow:auto;padding:0}
  .modal pre{
    margin:0;padding:18px 20px;font-family:var(--mono);font-size:12.5px;line-height:1.75;
    color:var(--ink);white-space:pre-wrap;word-break:break-word;
  }
  .modal .foot{
    border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;align-items:center;
    font-size:12px;color:var(--ink-3);
  }

  #toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);
    background:#101828;color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;
    opacity:0;pointer-events:none;transition:.18s;z-index:30;
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:860px){
    main{grid-template-columns:1fr;grid-template-rows:1fr 6px 1fr}
    #divider{cursor:row-resize}
    #editorWrap,#issues{border-right:0}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><b>FlowScript</b><span>流程圖原型</span></div>
  <nav class="tabs">
    <a class="on" href="./">編輯</a>
    <a href="../view/" id="viewTab">檢視</a>
  </nav>
  <div class="spacer"></div>
  <button class="btn" id="btnSpec">給 AI 的使用說明</button>
  <button class="btn" id="btnExample">載入範例</button>
  <button class="btn" id="btnSvg">SVG</button>
  <button class="btn" id="btnPng">PNG</button>
  <button class="btn primary" id="btnShare">複製檢視連結</button>
</header>

<main id="split">
  <section>
    <div class="pane-head"><b>語法輸入</b><span id="stat"></span></div>
    <div id="editorWrap">
      <div id="gutter"></div>
      <textarea id="src" spellcheck="false" placeholder="在這裡輸入流程圖語法…"></textarea>
    </div>
    <div id="issues"></div>
  </section>

  <div id="divider"></div>

  <section id="preview">
    <div class="pane-head"><b>即時預覽</b><span id="titleOut"></span></div>
    <div id="canvasWrap">
      <div id="canvas"></div>
      <div class="hint">滾輪縮放 · 拖曳平移</div>
      <div class="float-tools">
        <button class="btn icon" id="zoomOut" title="縮小">−</button>
        <button class="btn icon" id="zoomIn" title="放大">＋</button>
        <button class="btn" id="zoomFit" title="符合視窗">符合視窗</button>
      </div>
    </div>
  </section>
</main>

<div class="mask" id="specMask">
  <div class="modal">
    <header>
      <div class="brand"><b>給 AI 的使用說明</b><span>複製後貼給 GPT / Claude，即可請 AI 直接產出流程圖語法</span></div>
      <div class="spacer"></div>
      <button class="btn" id="specClose">關閉</button>
    </header>
    <div class="body"><pre id="specText"></pre></div>
    <div class="foot">
      <button class="btn primary" id="specCopy">複製全部說明</button>
      <span>貼給 AI 後，把 AI 回覆的原始碼直接貼回左側即可畫圖。</span>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="../flowchart.js"></script>
<script>
(function () {
  'use strict';
  var FS = window.FlowScript;
  var STORE_KEY = 'flowscript.source';

  var ta = document.getElementById('src');
  var gutter = document.getElementById('gutter');
  var issues = document.getElementById('issues');
  var stat = document.getElementById('stat');
  var titleOut = document.getElementById('titleOut');
  var canvas = document.getElementById('canvas');
  var toastEl = document.getElementById('toast');

  var vp = null, current = null, keepView = false, timer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove('on'); }, 1800);
  }

  /* ---------- 初始內容 ---------- */
  var initial = FS.sourceFromLocation();
  if (initial == null) { try { initial = localStorage.getItem(STORE_KEY); } catch (e) { initial = null; } }
  if (initial == null || !initial.trim()) initial = FS.EXAMPLE;
  ta.value = initial;

  /* ---------- 繪製 ---------- */
  function draw() {
    var prev = keepView && vp ? vp.get() : null;
    var res = FS.renderInto(canvas, ta.value);
    current = res;
    vp = FS.attachViewport(res.svg, res.width, res.height);
    if (prev) vp.set(prev);
    keepView = true;

    titleOut.textContent = res.model.title ? '｜' + res.model.title : '';
    stat.textContent = '｜' + res.model.nodes.size + ' 個節點 · ' + res.model.edges.length + ' 條連線';
    showIssues(res.errors);
    try { localStorage.setItem(STORE_KEY, ta.value); } catch (e) { /* ignore */ }
  }

  function showIssues(errs) {
    var bad = {};
    issues.innerHTML = '';
    if (!errs.length) {
      var ok = document.createElement('div');
      ok.className = 'issue ok';
      ok.innerHTML = '<span class="ln">OK</span><span>語法正確，已完成繪製。</span>';
      issues.appendChild(ok);
    } else {
      errs.forEach(function (e) {
        if (!e.warn && e.line) bad[e.line] = true;
        var row = document.createElement('div');
        row.className = 'issue ' + (e.warn ? 'warn' : 'err');
        var ln = document.createElement('span');
        ln.className = 'ln';
        ln.textContent = e.line ? '第 ' + e.line + ' 行' : '整體';
        var msg = document.createElement('span');
        msg.textContent = e.msg;
        row.appendChild(ln); row.appendChild(msg);
        row.addEventListener('click', function () { gotoLine(e.line); });
        issues.appendChild(row);
      });
    }
    paintGutter(bad);
  }

  function paintGutter(bad) {
    var n = ta.value.split('\n').length;
    var html = '';
    for (var i = 1; i <= n; i++) html += '<div' + (bad[i] ? ' class="bad"' : '') + '>' + i + '</div>';
    gutter.innerHTML = html;
    gutter.scrollTop = ta.scrollTop;
  }

  function gotoLine(line) {
    if (!line) return;
    var lines = ta.value.split('\n');
    var pos = 0;
    for (var i = 0; i < line - 1 && i < lines.length; i++) pos += lines[i].length + 1;
    ta.focus();
    ta.setSelectionRange(pos, pos + (lines[line - 1] || '').length);
    ta.scrollTop = Math.max(0, (line - 4) * 21);
    gutter.scrollTop = ta.scrollTop;
  }

  function schedule() {
    clearTimeout(timer);
    paintGutter({});
    timer = setTimeout(draw, 180);
  }

  ta.addEventListener('input', schedule);
  ta.addEventListener('scroll', function () { gutter.scrollTop = ta.scrollTop; });

  /* ---------- 工具列 ---------- */
  document.getElementById('btnExample').addEventListener('click', function () {
    ta.value = FS.EXAMPLE; keepView = false; draw(); toast('已載入範例');
  });
  document.getElementById('zoomIn').addEventListener('click', function () { vp && vp.zoom(1.2); });
  document.getElementById('zoomOut').addEventListener('click', function () { vp && vp.zoom(1 / 1.2); });
  document.getElementById('zoomFit').addEventListener('click', function () { vp && vp.fit(); });

  document.getElementById('btnShare').addEventListener('click', function () {
    var url = FS.buildViewURL(ta.value);
    FS.copyText(url).then(function () {
      toast('檢視連結已複製（' + url.length + ' 字元）');
    }, function () {
      window.prompt('請手動複製檢視連結：', url);
    });
  });

  document.getElementById('viewTab').addEventListener('click', function (e) {
    e.preventDefault();
    window.open(FS.buildViewURL(ta.value), '_blank');
  });

  function fileName(ext) {
    var t = (current && current.model.title) ? current.model.title : 'flowchart';
    return t.replace(/[\\/:*?"<>|]/g, '_') + '.' + ext;
  }

  document.getElementById('btnSvg').addEventListener('click', function () {
    if (!current) return;
    var str = FS.toSVGString(current.svg, current.width, current.height);
    FS.download(new Blob([str], { type: 'image/svg+xml' }), fileName('svg'));
  });

  document.getElementById('btnPng').addEventListener('click', function () {
    if (!current) return;
    var str = FS.toSVGString(current.svg, current.width, current.height);
    FS.toPNGBlob(str, current.width, current.height, 2, function (blob) {
      if (!blob) { toast('PNG 匯出失敗'); return; }
      FS.download(blob, fileName('png'));
    });
  });

  /* ---------- 使用說明 ---------- */
  var mask = document.getElementById('specMask');
  document.getElementById('specText').textContent = FS.SPEC;
  document.getElementById('btnSpec').addEventListener('click', function () { mask.classList.add('on'); });
  if (location.hash === '#spec') mask.classList.add('on');  // 可用 edit/#spec 直接開啟說明
  document.getElementById('specClose').addEventListener('click', function () { mask.classList.remove('on'); });
  mask.addEventListener('click', function (e) { if (e.target === mask) mask.classList.remove('on'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') mask.classList.remove('on'); });
  document.getElementById('specCopy').addEventListener('click', function () {
    FS.copyText(FS.SPEC).then(function () { toast('使用說明已複製，可直接貼給 AI'); },
      function () { toast('複製失敗，請手動選取'); });
  });

  /* ---------- 分隔線拖曳 ---------- */
  var split = document.getElementById('split');
  var divider = document.getElementById('divider');
  var dragging = false;
  divider.addEventListener('pointerdown', function (e) {
    dragging = true; divider.setPointerCapture(e.pointerId); e.preventDefault();
  });
  divider.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var r = split.getBoundingClientRect();
    if (window.matchMedia('(max-width:860px)').matches) {
      var py = Math.min(0.8, Math.max(0.2, (e.clientY - r.top) / r.height));
      split.style.gridTemplateRows = (py * 100) + '% 6px 1fr';
    } else {
      var px = Math.min(0.75, Math.max(0.2, (e.clientX - r.left) / r.width));
      split.style.gridTemplateColumns = (px * 100) + '% 6px 1fr';
    }
  });
  divider.addEventListener('pointerup', function (e) {
    dragging = false;
    try { divider.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });

  window.addEventListener('resize', function () { if (vp) vp.clamp(); });

  draw();
  vp.fit();
})();
</script>
</body>
</html>

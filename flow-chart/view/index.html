<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowScript 流程圖檢視</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --line:#e4e7ec; --line-strong:#d0d5dd;
    --ink:#101828; --ink-2:#475467; --ink-3:#98a2b3;
    --accent:#2563eb; --danger:#d92d20; --danger-soft:#fef3f2;
    --mono:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  code,pre{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);
    display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:0 16px;height:56px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:baseline;gap:8px}
  .brand b{font-size:15px}
  .brand span{font-size:12px;color:var(--ink-3)}
  a.brand{
    text-decoration:none;color:inherit;padding:6px 8px;margin-left:-8px;border-radius:8px;
  }
  a.brand:hover{background:#f2f4f7}
  a.brand:hover b{color:var(--accent)}
  .seg{display:inline-flex;background:#f2f4f7;border-radius:8px;padding:3px;gap:2px}
  .seg button{
    font-family:inherit;font-size:12.5px;border:0;background:transparent;color:var(--ink-2);
    padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap;
  }
  .seg button:hover{color:var(--ink)}
  .seg button.on{
    background:var(--panel);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(16,24,40,.08);
  }
  .chip{
    font-size:11px;color:var(--ink-2);background:#f2f4f7;border-radius:999px;
    padding:3px 10px;letter-spacing:.3px;
  }
  .spacer{flex:1}
  button.btn,a.btn{
    font-family:inherit;font-size:13px;color:var(--ink-2);background:var(--panel);
    border:1px solid var(--line-strong);border-radius:8px;padding:7px 12px;cursor:pointer;
    text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  button.btn:hover,a.btn:hover{background:#f9fafb;color:var(--ink)}
  button.icon{padding:7px 9px;line-height:1}

  main{flex:1;position:relative;min-height:0;overflow:hidden}
  #canvas{position:absolute;inset:0}
  #canvas svg{display:block;width:100%;height:100%}

  .float-tools{
    position:absolute;right:14px;bottom:14px;display:flex;gap:6px;
    background:var(--panel);padding:6px;border-radius:10px;
    border:1px solid var(--line);box-shadow:0 4px 14px rgba(16,24,40,.08);
  }
  .banner{
    position:absolute;left:14px;top:14px;max-width:min(520px,70%);
    background:var(--danger-soft);border:1px solid #fecdca;color:var(--danger);
    border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.7;display:none;
  }
  .banner.on{display:block}
  .banner b{display:block;margin-bottom:2px}

  .empty{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;color:var(--ink-3);text-align:center;padding:24px;
  }
  .empty.on{display:flex}
  .empty h2{margin:0;font-size:16px;color:var(--ink-2);font-weight:600}
  .empty code{
    font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);
    padding:8px 12px;border-radius:8px;color:var(--ink-2);display:block;
  }
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);
    background:#101828;color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;
    opacity:0;pointer-events:none;transition:.18s;z-index:30;
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}
  @media (max-width:720px){ .hide-sm{display:none} }
</style>
</head>
<body>

<header>
  <a class="brand" href="../" title="回到 FlowScript 說明首頁"><b id="docTitle">FlowScript</b><span>流程圖檢視</span></a>
  <span class="chip hide-sm">唯讀</span>
  <span class="chip hide-sm" id="stat"></span>
  <div class="spacer"></div>
  <button class="btn hide-sm" id="btnCopySrc">複製原始碼</button>
  <button class="btn hide-sm" id="btnSvg">SVG</button>
  <button class="btn hide-sm" id="btnPng">PNG</button>
  <a class="btn" id="btnEdit" href="../edit/">在編輯器開啟</a>
</header>

<main>
  <div id="canvas"></div>
  <div class="banner" id="banner"></div>
  <div class="empty" id="empty">
    <h2>這個網址沒有帶入流程圖內容</h2>
    <div>請用 <code>?src=</code> 參數帶入以 base64url 編碼的原始碼，<br>或直接到編輯器產生檢視連結。</div>
    <code>../view/?src=&lt;編碼後的原始碼&gt;</code>
    <a class="btn" href="../edit/">前往編輯器</a>
  </div>
  <div class="float-tools" id="tools">
    <div class="seg" id="dirSeg">
      <button data-dir="TD" title="由上往下">直式</button>
      <button data-dir="LR" title="由左往右">橫式</button>
    </div>
    <button class="btn icon" id="zoomOut" title="縮小">−</button>
    <button class="btn icon" id="zoomIn" title="放大">＋</button>
    <button class="btn" id="zoomFit">符合視窗</button>
  </div>
</main>

<div id="toast"></div>

<script src="../flowchart.js"></script>
<script>
(function () {
  'use strict';
  var FS = window.FlowScript;
  var canvas = document.getElementById('canvas');
  var toastEl = document.getElementById('toast');
  var source = FS.sourceFromLocation();
  var vp = null, current = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove('on'); }, 1800);
  }

  if (source == null || !source.trim()) {
    document.getElementById('empty').classList.add('on');
    document.getElementById('tools').style.display = 'none';
  } else {
    // ?dir=TD|LR：不改原始碼，只覆寫呈現方向
    var forced = null;
    try {
      var q = new URLSearchParams(location.search).get('dir');
      if (q && /^(TD|TB|LR)$/i.test(q)) forced = q.toUpperCase() === 'LR' ? 'LR' : 'TD';
    } catch (e) { forced = null; }

    function render() {
      current = FS.renderInto(canvas, source, forced ? { direction: forced } : null);
      vp = FS.attachViewport(current.svg, current.width, current.height);
      var dir = forced || current.model.direction;
      dirButtons.forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-dir') === dir); });
    }

    var dirButtons = Array.prototype.slice.call(document.querySelectorAll('#dirSeg button'));
    dirButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var dir = btn.getAttribute('data-dir');
        if ((forced || current.model.direction) === dir) return;
        forced = dir;
        render();
        try {   // 寫回網址，重新整理或分享時保留
          var url = new URL(location.href);
          url.searchParams.set('dir', dir);
          history.replaceState(null, '', url.toString());
        } catch (e) { /* ignore */ }
        document.getElementById('btnEdit').href = editHref();
        toast(dir === 'LR' ? '已切換為橫式' : '已切換為直式');
      });
    });

    render();

    document.getElementById('docTitle').textContent = current.model.title || 'FlowScript';
    document.getElementById('stat').textContent =
      current.model.nodes.size + ' 個節點 · ' + current.model.edges.length + ' 條連線';

    var errs = current.errors.filter(function (e) { return !e.warn; });
    if (errs.length) {
      var b = document.getElementById('banner');
      b.classList.add('on');
      b.innerHTML = '<b>語法有 ' + errs.length + ' 處問題，圖形可能不完整</b>' +
        errs.slice(0, 5).map(function (e) {
          return (e.line ? '第 ' + e.line + ' 行：' : '') + e.msg;
        }).join('<br>');
    }

    // 在編輯器開啟時，把目前看到的方向一併帶過去
    function editHref() {
      return FS.buildViewURL(forced ? FS.setDirection(source, forced) : source, '../edit/');
    }
    document.getElementById('btnEdit').href = editHref();
    document.getElementById('btnCopySrc').addEventListener('click', function () {
      FS.copyText(source).then(function () { toast('原始碼已複製'); },
        function () { toast('複製失敗'); });
    });

    var name = (current.model.title || 'flowchart').replace(/[\\/:*?"<>|]/g, '_');
    document.getElementById('btnSvg').addEventListener('click', function () {
      var str = FS.toSVGString(current.svg, current.width, current.height);
      FS.download(new Blob([str], { type: 'image/svg+xml' }), name + '.svg');
    });
    document.getElementById('btnPng').addEventListener('click', function () {
      var str = FS.toSVGString(current.svg, current.width, current.height);
      FS.toPNGBlob(str, current.width, current.height, 2, function (blob) {
        if (!blob) { toast('PNG 匯出失敗'); return; }
        FS.download(blob, name + '.png');
      });
    });

    document.getElementById('zoomIn').addEventListener('click', function () { vp.zoom(1.2); });
    document.getElementById('zoomOut').addEventListener('click', function () { vp.zoom(1 / 1.2); });
    document.getElementById('zoomFit').addEventListener('click', function () { vp.fit(); });
    window.addEventListener('resize', function () { vp.clamp(); });
  }
})();
</script>
</body>
</html>

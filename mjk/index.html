<title>魔術道具報價單</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#FBF8F8; --surface:#FFFFFF; --surface-2:#F3EEEF;
  --ink:#1B1418; --ink-2:#4B4044; --muted:#8A7B80;
  --line:#E6DEDF; --line-strong:#CEC2C4;
  --accent:#C00A1C; --accent-2:#960513; --accent-soft:#FBE7E9; --accent-ink:#FFFFFF;
  --ok:#2E6F52; --ok-soft:#E4F0E9; --warn:#93600F; --warn-soft:#F7EBD8;
  --shadow:0 1px 2px rgba(27,20,24,.05), 0 14px 32px -20px rgba(27,20,24,.35);
  --r:10px;
  --topbar-h:59px;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141013; --surface:#1D171A; --surface-2:#262023;
    --ink:#F4ECEE; --ink-2:#D2C6CA; --muted:#9B8C91;
    --line:#332A2E; --line-strong:#4A3E42;
    --accent:#FF6B78; --accent-2:#FF8E98; --accent-soft:#3C1A20; --accent-ink:#1B1014;
    --ok:#6FBE97; --ok-soft:#1D2E26; --warn:#DFA64A; --warn-soft:#312614;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#141013; --surface:#1D171A; --surface-2:#262023;
  --ink:#F4ECEE; --ink-2:#D2C6CA; --muted:#9B8C91;
  --line:#332A2E; --line-strong:#4A3E42;
  --accent:#FF6B78; --accent-2:#FF8E98; --accent-soft:#3C1A20; --accent-ink:#1B1014;
  --ok:#6FBE97; --ok-soft:#1D2E26; --warn:#DFA64A; --warn-soft:#312614;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1220px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;margin-right:auto}
.brandlogo{display:block;margin:0;line-height:0}
.brandtag{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--muted);padding-left:13px;border-left:1px solid var(--line-strong);white-space:nowrap}
/* 品牌標誌：深色底自動換成反白版本 */
.logo{display:block;height:34px;width:auto}
.logo.on-dark{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .logo.on-light{display:none}
  :root:not([data-theme="light"]) .logo.on-dark{display:block}
}
:root[data-theme="dark"] .logo.on-light{display:none}
:root[data-theme="dark"] .logo.on-dark{display:block}
.steps{display:flex;align-items:center;gap:6px;font-size:12.5px}
.steps .st{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:999px;color:var(--muted);border:1px solid transparent}
.steps .st i{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:11px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.steps .st.on{color:var(--ink);border-color:var(--line-strong);background:var(--surface)}
.steps .st.on i{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.steps .st.done i{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.steps .sep{width:14px;height:1px;background:var(--line-strong)}

/* ---------- layout ---------- */
main{max-width:1220px;margin:0 auto;padding:22px 20px 132px}
.pick{display:block}

/* ---------- filters ---------- */
.filters{position:sticky;top:var(--topbar-h);z-index:20;background:var(--paper);
  border-bottom:1px solid var(--line);margin:-22px -20px 22px;padding:13px 20px 12px;
  display:flex;flex-direction:column;gap:10px}
.frow{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.frow .search{flex:1 1 260px;max-width:400px}
.frow select.sel{width:auto;min-width:148px}
.fdiv{width:1px;align-self:stretch;background:var(--line-strong);margin:0 3px}
.fpush{margin-left:auto}
.flabel{font-size:11px;letter-spacing:.16em;color:var(--muted);font-family:var(--mono);white-space:nowrap}
@media (max-width:640px){.filters{margin:-22px -20px 18px}.fdiv{display:none}.fpush{margin-left:0}}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:9px 12px}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:none;width:100%;outline:none;min-width:0}
.search svg{flex:none;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .12s,border-color .12s}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .suit{opacity:.75}
.chip .ct{font-family:var(--mono);font-size:11px;opacity:.65}
select.sel{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:9px 10px}
.switch{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.switch input{accent-color:var(--accent);width:16px;height:16px}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13px;padding:0;text-align:left;text-decoration:underline;text-underline-offset:3px}

/* ---------- catalog ---------- */
.catblock{margin-bottom:30px}
.cathead{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.cathead h2{font-size:16px}
.cathead .suit{color:var(--accent);font-size:15px}
.cathead .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 13px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.row:hover{border-color:var(--line-strong)}
.row.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.rname{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;min-width:0}
.rname b{font-weight:500}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.stock{font-size:11px;padding:1px 8px;border-radius:999px;font-family:var(--mono)}
.stock.ok{background:var(--ok-soft);color:var(--ok)}
.stock.low{background:var(--warn-soft);color:var(--warn)}
.price{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;text-align:right;white-space:nowrap}
.price .cost{display:block;font-size:10.5px;color:var(--muted)}
.qty{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.qty button{width:28px;height:28px;border:0;background:none;cursor:pointer;color:var(--ink-2);font-size:15px;line-height:1}
.qty button:hover{background:var(--surface-2);color:var(--accent)}
.qty input{width:44px;height:28px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);background:none;text-align:center;font-family:var(--mono);font-size:13px;outline:none}
.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--r)}

/* ---------- action bar ---------- */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:40;border-top:1px solid var(--line);background:var(--paper)}
.actionbar-in{max-width:1220px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tally{display:flex;align-items:baseline;gap:16px;margin-right:auto;flex-wrap:wrap}
.tally .lab{font-size:11px;letter-spacing:.14em;color:var(--muted);font-family:var(--mono)}
.tally .big{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:10px 18px;cursor:pointer;font-size:14.5px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- review ---------- */
.review{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;align-items:start}
@media (max-width:880px){.review{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
#sumPanel{position:sticky;top:var(--topbar-h)}
@media (max-width:880px){#sumPanel{position:static}}
.panel h2{font-size:17px;margin-bottom:4px}
.panel .hint{font-size:13px;color:var(--muted);margin:0 0 16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
@media (max-width:560px){.form{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px}
.field.wide{grid-column:1/-1}
.field label{font-size:11.5px;letter-spacing:.12em;color:var(--muted);font-family:var(--mono)}
.field input,.field textarea{background:var(--paper);border:1px solid var(--line-strong);border-radius:8px;padding:8px 11px;outline:none;font-family:inherit;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.rvcat{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.rvcat:first-child{border-top:0;margin-top:0;padding-top:0}
.rvcat .h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.rvcat .h .suit{color:var(--accent)}
.rvcat .h b{font-family:var(--serif)}
.rvcat .h .s{margin-left:auto;font-family:var(--mono);font-size:13px}
.rvrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:12px;align-items:center;padding:6px 0}
.rvrow .u{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.rvrow .t{font-family:var(--mono);font-size:13.5px;text-align:right;min-width:72px;font-variant-numeric:tabular-nums}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.del:hover{color:var(--accent)}
.sumline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;font-size:14px}
.sumline+.sumline{border-top:1px dashed var(--line)}
.sumline .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sumline.total{border-top:1.5px solid var(--ink);margin-top:6px;padding-top:11px;font-size:16px;font-weight:700}
.sumline.total .v{font-size:21px;color:var(--accent)}
.taxrow{display:flex;align-items:center;gap:8px}
.taxrow input{width:56px;background:var(--paper);border:1px solid var(--line-strong);border-radius:6px;padding:4px 7px;font-family:var(--mono);text-align:right}

/* ---------- quote sheet ---------- */
.sheetwrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.sheet{width:100%;max-width:860px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:3px;box-shadow:var(--shadow);padding:44px 46px 40px}
@media (max-width:560px){.sheet{padding:26px 20px}}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
.qbrand{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.qbrand .logo{width:198px;height:auto}
.qbrand .qname{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.05em;line-height:1.4}
.qbrand .qcontact{font-size:11.5px;color:var(--ink-2);line-height:1.65}
.qtitle{text-align:center;margin:22px 0 20px}
.qtitle b{font-family:var(--serif);font-size:25px;letter-spacing:.42em;padding-left:.42em;display:block}
.qtitle span{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--muted);padding-left:.3em}
.qmeta{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink-2);line-height:1.9}
.qmeta b{color:var(--ink)}
.qrule{height:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);margin:16px 0 0;padding-bottom:3px}
.qto{display:flex;gap:30px;flex-wrap:wrap;margin-bottom:22px;font-size:13.5px}
.qto div span{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-family:var(--mono);margin-bottom:2px}
.qtable{overflow-x:auto}
table.q{width:100%;border-collapse:collapse;font-size:13.5px}
table.q th{text-align:left;font-size:11px;letter-spacing:.14em;font-family:var(--mono);font-weight:500;color:var(--ink-2);border-bottom:1px solid var(--ink);padding:0 10px 7px}
table.q th:last-child,table.q td:last-child{text-align:right}
table.q td{border-bottom:1px solid var(--line);padding:11px 10px;vertical-align:top}
table.q tr{break-inside:avoid}
table.q .c1{width:122px;font-family:var(--serif);font-weight:500;white-space:nowrap}
table.q .c1 .suit{color:var(--accent);margin-right:5px}
table.q .c3{width:108px;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.detail{display:flex;flex-direction:column;gap:3px}
.detail .li{display:flex;gap:10px;align-items:baseline}
.detail .li .nm{flex:1}
.detail .li .qy,.detail .li .st{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.detail .li .st{min-width:62px;text-align:right}
.qsum{margin-left:auto;width:min(340px,100%);margin-top:20px}
.qsum .ln{display:flex;justify-content:space-between;gap:16px;padding:7px 10px;font-size:13.5px}
.qsum .ln .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.qsum .ln.sub{border-top:1px solid var(--line)}
.qsum .ln.grand{background:var(--accent-soft);border-radius:6px;margin-top:6px;padding:11px 10px;font-weight:700;font-size:15px}
.qsum .ln.grand .v{font-size:19px;color:var(--accent)}
.qnote{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;font-size:12.5px;color:var(--ink-2);white-space:pre-wrap}
.sigs{display:flex;gap:40px;margin-top:34px}
.sigs div{flex:1;border-top:1px solid var(--line-strong);padding-top:7px;font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.1em}
.qfoot{margin-top:26px;display:flex;justify-content:space-between;gap:30px;font-size:11.5px;color:var(--muted);font-family:var(--mono);flex-wrap:wrap}

/* ---------- print ---------- */
@media print{
  :root{
    --paper:#ffffff; --surface:#ffffff; --surface-2:#f4f1f1;
    --ink:#111111; --ink-2:#3C3335; --muted:#6D6265;
    --line:#D8D0D1; --line-strong:#BBB3B4;
    --accent:#C00A1C; --accent-soft:#FBE7E9; --accent-ink:#ffffff;
    --shadow:none;
  }
  .topbar,.actionbar,.noprint{display:none !important}
  .logo.on-dark{display:none !important}
  .logo.on-light{display:block !important}
  body,.qsum .ln.grand,.stock,.logo{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  main{padding:0;max-width:none}
  body{background:#fff}
  .sheet{max-width:none;border:0;box-shadow:none;padding:0;border-radius:0}
  @page{size:A4;margin:14mm}
  thead{display:table-header-group}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1 class="brandlogo" id="brandMark"></h1>
      <span class="brandtag">報價單產生器</span>
    </div>
    <nav class="steps" id="steps" aria-label="流程">
      <span class="st on" data-s="1"><i>1</i>選擇品項</span><span class="sep"></span>
      <span class="st" data-s="2"><i>2</i>確認明細</span><span class="sep"></span>
      <span class="st" data-s="3"><i>3</i>報價單</span>
    </nav>
  </div>
</header>

<main>
  <section id="step1" class="pick">
    <div class="filters">
      <div class="frow">
        <label class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="搜尋品名，例如：骰、預言、鑽石棒" autocomplete="off">
        </label>
        <span class="flabel">次分類</span>
        <select class="sel" id="subSel" aria-label="次分類"></select>
        <span class="fdiv"></span>
        <label class="switch"><input type="checkbox" id="onlySel">只顯示已選</label>
        <label class="switch"><input type="checkbox" id="showCost">顯示成本與毛利</label>
        <button class="linkbtn fpush" id="clearAll" type="button">清除所有已選</button>
      </div>
      <div class="frow">
        <span class="flabel">大分類</span>
        <div class="chips" id="catChips"></div>
        <span class="fdiv"></span>
        <span class="flabel">供應狀態</span>
        <div class="chips" id="stockChips"></div>
      </div>
    </div>
    <div id="catalog"></div>
  </section>

  <section id="step2" class="review" hidden>
    <div class="col">
      <div class="panel">
        <h2>報價資訊</h2>
        <p class="hint">這些欄位會直接印在報價單上，留白就不會顯示。</p>
        <div class="form">
          <div class="field"><label for="f-no">報價單號</label><input id="f-no" type="text"></div>
          <div class="field"><label for="f-date">報價日期</label><input id="f-date" type="date"></div>
          <div class="field"><label for="f-cust">客戶／單位</label><input id="f-cust" type="text" placeholder="OO 實業有限公司"></div>
          <div class="field"><label for="f-contact">聯絡人</label><input id="f-contact" type="text" placeholder="王小明 先生"></div>
          <div class="field"><label for="f-from">報價單位</label><input id="f-from" type="text" value="美吉克魔幻藝術"></div>
          <div class="field"><label for="f-valid">有效期限</label><input id="f-valid" type="text" value="報價日起 30 天"></div>
          <div class="field wide"><label for="f-info">聯絡資訊（印在信頭）</label><input id="f-info" type="text" placeholder="電話 0000-000-000　統編 00000000　台南市OO區OO路 00 號"></div>
          <div class="field wide"><label for="f-note">備註</label><textarea id="f-note" rows="2" placeholder="單價已含運費；交期約 7 個工作天。"></textarea></div>
        </div>
      </div>
      <div class="panel">
        <h2>品項明細</h2>
        <p class="hint">可直接改數量，或按 × 移除品項。</p>
        <div id="rvList"></div>
      </div>
    </div>
    <div class="panel" id="sumPanel">
      <h2>金額試算</h2>
      <p class="hint">稅金以外加方式計算。</p>
      <div id="rvSum"></div>

const LOGO = '<img class="logo on-light" src="' + LOGO_LIGHT + '" alt="美吉克魔幻藝術 MagiCooL">' +
  '<img class="logo on-dark" src="' + LOGO_DARK + '" alt="" aria-hidden="true">';
const CATS = [...new Set(ITEMS.map(i => i.c))];
const money = n => "$" + Math.round(n).toLocaleString("en-US");
const el = id => document.getElementById(id);

const state = {
  step: 1,
  sel: new Map(),
  cat: "全部", sub: "全部", stock: "全部", q: "",
  onlySel: false, cost: false, tax: 5
};

/* ---------- 篩選 ---------- */
const norm = s => s.toLowerCase().replace(/\s+/g, "");
function subseq(hay, needle){
  let j = 0;
  for (const ch of hay){ if (ch === needle[j]) j++; if (j === needle.length) return true; }
  return j === needle.length;
}
function match(it, q){
  const terms = norm(q).split(/[,、]+/).filter(Boolean);
  if (!terms.length) return true;
  const hay = norm(it.n + it.s + it.c);
  return terms.every(t => hay.includes(t) || subseq(hay, t));
}
function visible(){
  return ITEMS.map((it, i) => ({it, i})).filter(({it, i}) =>
    (state.cat === "全部" || it.c === state.cat) &&
    (state.sub === "全部" || it.s === state.sub) &&
    (state.stock === "全部" || it.k === state.stock) &&
    (!state.onlySel || state.sel.has(i)) &&
    match(it, state.q));
}

/* ---------- 金額 ---------- */
function groups(){
  const g = new Map();
  for (const [i, qty] of state.sel){
    const it = ITEMS[i];
    if (!g.has(it.c)) g.set(it.c, {cat: it.c, lines: [], sum: 0, cost: 0});
    const b = g.get(it.c);
    b.lines.push({i, it, qty, total: it.p * qty});
    b.sum += it.p * qty;
    b.cost += (it.w + it.f) * qty;
  }
  return CATS.filter(c => g.has(c)).map(c => g.get(c));
}
function totals(){
  const gs = groups();
  const sub = gs.reduce((a, b) => a + b.sum, 0);
  const cost = gs.reduce((a, b) => a + b.cost, 0);
  const tax = Math.round(sub * state.tax / 100);
  return {gs, sub, cost, tax, grand: sub + tax,
    count: state.sel.size,
    qty: [...state.sel.values()].reduce((a, b) => a + b, 0)};
}

/* ---------- 步驟一 ---------- */
function chipSet(host, values, key, counts){
  host.innerHTML = "";
  for (const v of values){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.setAttribute("aria-pressed", String(state[key] === v));
    b.innerHTML = (SUIT[v] ? '<span class="suit">' + SUIT[v] + "</span>" : "") +
      "<span>" + v + "</span>" +
      (counts && counts[v] != null ? '<span class="ct">' + counts[v] + "</span>" : "");
    b.onclick = () => {
      state[key] = v;
      if (key === "cat") state.sub = "全部";
      renderFilters(); renderCatalog();
    };
    host.appendChild(b);
  }
}
function renderFilters(){
  const cc = {"全部": ITEMS.length};
  CATS.forEach(c => cc[c] = ITEMS.filter(i => i.c === c).length);
  chipSet(el("catChips"), ["全部", ...CATS], "cat", cc);
  chipSet(el("stockChips"), ["全部", "有現貨", "庫存少"], "stock", null);

  const pool = ITEMS.filter(i => state.cat === "全部" || i.c === state.cat);
  const subs = [...new Set(pool.map(i => i.s))].sort();
  if (!subs.includes(state.sub)) state.sub = "全部";
  el("subSel").innerHTML = ["全部", ...subs].map(s => {
    const n = s === "全部" ? pool.length : pool.filter(i => i.s === s).length;
    return '<option value="' + s + '"' + (s === state.sub ? " selected" : "") + ">" + s + "（" + n + "）</option>";
  }).join("");
}

function setQty(i, n){
  n = Math.max(0, Math.min(9999, Math.trunc(n) || 0));
  if (n === 0) state.sel.delete(i); else state.sel.set(i, n);
  renderCatalog(); renderTally();
}
function toggle(i){
  if (state.sel.has(i)) state.sel.delete(i); else state.sel.set(i, 1);
  renderCatalog(); renderTally();
}
function qtyBox(i){
  const wrap = document.createElement("div");
  wrap.className = "qty";
  wrap.onclick = e => e.stopPropagation();
  const dec = document.createElement("button");
  dec.type = "button"; dec.textContent = "−"; dec.setAttribute("aria-label", "減少數量");
  const inp = document.createElement("input");
  inp.type = "text"; inp.inputMode = "numeric"; inp.value = state.sel.get(i) ?? 1;
  inp.setAttribute("aria-label", "數量");
  const inc = document.createElement("button");
  inc.type = "button"; inc.textContent = "+"; inc.setAttribute("aria-label", "增加數量");
  dec.onclick = () => setQty(i, (state.sel.get(i) || 1) - 1);
  inc.onclick = () => setQty(i, (state.sel.get(i) || 0) + 1);
  inp.onchange = () => setQty(i, parseInt(inp.value, 10) || 0);
  wrap.append(dec, inp, inc);
  return wrap;
}

function renderCatalog(){
  const host = el("catalog");
  const vis = visible();
  host.innerHTML = "";
  if (!vis.length){
    host.innerHTML = '<p class="empty">沒有符合條件的品項。試試清空搜尋或切回「全部」分類。</p>';
    return;
  }
  for (const c of CATS){
    const rows = vis.filter(v => v.it.c === c);
    if (!rows.length) continue;
    const block = document.createElement("div");
    block.className = "catblock";
    const head = document.createElement("div");
    head.className = "cathead";
    head.innerHTML = '<span class="suit">' + SUIT[c] + '</span><h2>' + c + '</h2><span class="n">' + rows.length + " 項</span>";
    const list = document.createElement("div");
    list.className = "rows";
    for (const {it, i} of rows){
      const on = state.sel.has(i);
      const r = document.createElement("div");
      r.className = "row" + (on ? " on" : "");
      r.onclick = () => toggle(i);
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = on;
      cb.setAttribute("aria-label", "選取 " + it.n);
      cb.onclick = e => { e.stopPropagation(); toggle(i); };
      const nm = document.createElement("div");
      nm.className = "rname";
      nm.innerHTML = "<b>" + it.n + "</b>" +
        '<span class="tag">' + it.s + "</span>" +
        '<span class="stock ' + (it.k === "有現貨" ? "ok" : "low") + '">' + it.k + "</span>";
      const pr = document.createElement("div");
      pr.className = "price";
      pr.innerHTML = money(it.p) + (state.cost ? '<span class="cost">成本 ' + money(it.w + it.f) + "</span>" : "");
      r.append(cb, nm, pr, qtyBox(i));
      list.appendChild(r);
    }
    block.append(head, list);
    host.appendChild(block);
  }
}

function renderTally(){
  const t = totals();
  el("tCount").textContent = t.count;
  el("tQty").textContent = t.qty;
  el("tSum").textContent = money(t.sub);
  el("tMargin").hidden = !state.cost;
  el("tMarginV").textContent = money(t.sub - t.cost);
  el("toReview").disabled = t.count === 0;
  if (state.step === 2) renderReview();
}

/* ---------- 步驟二 ---------- */
function renderReview(){
  const t = totals();
  const list = el("rvList");
  list.innerHTML = "";
  if (!t.count){
    list.innerHTML = '<p class="empty">目前沒有品項，請回上一步選擇。</p>';
  }
  for (const g of t.gs){
    const box = document.createElement("div");
    box.className = "rvcat";
    const h = document.createElement("div");
    h.className = "h";
    h.innerHTML = '<span class="suit">' + SUIT[g.cat] + "</span><b>" + g.cat + "</b><span class='s'>" + money(g.sum) + "</span>";
    box.appendChild(h);
    for (const ln of g.lines){
      const row = document.createElement("div");
      row.className = "rvrow";
      const nm = document.createElement("div");
      nm.textContent = ln.it.n;
      const u = document.createElement("div");
      u.className = "u"; u.textContent = money(ln.it.p) + " / 個";
      const tot = document.createElement("div");
      tot.className = "t"; tot.textContent = money(ln.total);
      const del = document.createElement("button");
      del.type = "button"; del.className = "del"; del.innerHTML = "&times;";
      del.setAttribute("aria-label", "移除 " + ln.it.n);
      del.onclick = () => setQty(ln.i, 0);
      row.append(nm, u, qtyBox(ln.i), tot, del);
      box.appendChild(row);
    }
    list.appendChild(box);
  }
  el("rvSum").innerHTML =
    '<div class="sumline"><span>品項數</span><span class="v">' + t.count + " 項 / " + t.qty + " 個</span></div>" +
    '<div class="sumline"><span>所有品項總價</span><span class="v">' + money(t.sub) + "</span></div>" +
    '<div class="sumline"><span class="taxrow">外含稅金 <input id="taxIn" type="text" inputmode="decimal" aria-label="稅率" value="' + state.tax + '">%</span><span class="v">' + money(t.tax) + "</span></div>" +
    (state.cost ? '<div class="sumline"><span>預估毛利</span><span class="v">' + money(t.sub - t.cost) + "</span></div>" : "") +
    '<div class="sumline total"><span>含稅金額</span><span class="v">' + money(t.grand) + "</span></div>";
  el("taxIn").onchange = e => {
    state.tax = Math.max(0, Math.min(100, parseFloat(e.target.value) || 0));
    renderReview();
  };
  el("toQuote").disabled = t.count === 0;
}

/* ---------- 步驟三 ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val = id => el(id).value.trim();

function renderSheet(){
  const t = totals();
  const d = val("f-date") || new Date().toISOString().slice(0, 10);
  const rows = t.gs.map(g =>
    "<tr>" +
      '<td class="c1"><span class="suit">' + SUIT[g.cat] + "</span>" + g.cat + "</td>" +
      "<td><div class='detail'>" + g.lines.map(ln =>
        '<div class="li"><span class="nm">' + esc(ln.it.n) + "</span>" +
        '<span class="qy">' + money(ln.it.p) + " × " + ln.qty + "</span>" +
        '<span class="st">' + money(ln.total) + "</span></div>").join("") + "</div></td>" +
      '<td class="c3">' + money(g.sum) + "</td>" +
    "</tr>").join("");

  el("sheet").innerHTML =
    '<div class="qhead">' +
      '<div class="qbrand">' + LOGO +
        '<div><div class="qname">' + esc(val("f-from")) + "</div>" +
        (val("f-info") ? '<div class="qcontact">' + esc(val("f-info")) + "</div>" : "") +
      "</div></div>" +
      '<div class="qmeta">' +
        (val("f-no") ? "單號 <b>" + esc(val("f-no")) + "</b><br>" : "") +
        "日期 <b>" + esc(d) + "</b>" +
        (val("f-valid") ? "<br>有效期限 <b>" + esc(val("f-valid")) + "</b>" : "") +
      "</div>" +
    "</div>" +
    '<div class="qrule"></div>' +
    '<h2 class="qtitle"><b>報價單</b><span>QUOTATION</span></h2>' +
    '<div class="qto">' +
      (val("f-cust") ? "<div><span>客戶／單位</span>" + esc(val("f-cust")) + "</div>" : "") +
      (val("f-contact") ? "<div><span>聯絡人</span>" + esc(val("f-contact")) + "</div>" : "") +
      "<div><span>品項數</span>" + t.count + " 項 &middot; 共 " + t.qty + " 個</div>" +
    "</div>" +
    '<div class="qtable"><table class="q"><thead><tr><th>品項</th><th>詳情（品項與數量）</th><th>品項總價</th></tr></thead><tbody>' +
      rows + "</tbody></table></div>" +
    '<div class="qsum">' +
      '<div class="ln sub"><span>所有品項總價</span><span class="v">' + money(t.sub) + "</span></div>" +
      '<div class="ln"><span>外含稅金（' + state.tax + "%）</span><span class='v'>" + money(t.tax) + "</span></div>" +
      '<div class="ln grand"><span>含稅金額</span><span class="v">' + money(t.grand) + "</span></div>" +
    "</div>" +
    (val("f-note") ? '<div class="qnote">備註：' + esc(val("f-note")) + "</div>" : "") +
    '<div class="sigs"><div>報價單位 / 簽章</div><div>客戶確認 / 簽章</div></div>' +
    '<div class="qfoot"><span>單價已含運費，金額以新台幣計算。</span><span>' + esc(d) + "</span></div>";
}

/* ---------- 切換步驟 ---------- */
function go(n){
  state.step = n;
  el("step1").hidden = n !== 1;
  el("step2").hidden = n !== 2;
  el("step3").hidden = n !== 3;
  el("bar1").hidden = n !== 1;
  el("bar3").hidden = n !== 3;
  el("bar3").style.display = n === 3 ? "flex" : "none";
  el("bar3").style.gap = "10px";
  el("actionbar").hidden = n === 2;
  document.querySelectorAll("#steps .st").forEach(s => {
    const k = Number(s.dataset.s);
    s.classList.toggle("on", k === n);
    s.classList.toggle("done", k < n);
  });
  if (n === 2) renderReview();
  if (n === 3) renderSheet();
  window.scrollTo(0, 0);
}

el("q").addEventListener("input", e => { state.q = e.target.value; renderCatalog(); });
el("subSel").addEventListener("change", e => { state.sub = e.target.value; renderCatalog(); });
el("onlySel").addEventListener("change", e => { state.onlySel = e.target.checked; renderCatalog(); });
el("showCost").addEventListener("change", e => { state.cost = e.target.checked; renderCatalog(); renderTally(); });
el("clearAll").addEventListener("click", () => { state.sel.clear(); renderCatalog(); renderTally(); });
el("toReview").addEventListener("click", () => go(2));
el("backTo1").addEventListener("click", () => go(1));
el("toQuote").addEventListener("click", () => go(3));
el("backTo2").addEventListener("click", () => go(2));
el("doPrint").addEventListener("click", () => window.print());

el("brandMark").innerHTML = LOGO;

const topbar = document.querySelector(".topbar");
const syncTopbar = () => document.documentElement.style.setProperty("--topbar-h", topbar.offsetHeight + "px");
if (window.ResizeObserver) new ResizeObserver(syncTopbar).observe(topbar);
window.addEventListener("resize", syncTopbar);
syncTopbar();
el("f-date").value = new Date().toISOString().slice(0, 10);
el("f-no").value = "Q" + new Date().toISOString().slice(0, 10).replace(/-/g, "") + "-01";

renderFilters();
renderCatalog();
renderTally();
go(1);
</script>

<title>通報流程測試導引</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root {
  --ground: #F2F5F4;
  --surface: #FFFFFF;
  --surface-2: #E8EEEC;
  --ink: #16201E;
  --muted: #586A65;
  --line: #D2DCD8;
  --accent: #0D6B62;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFEB;
  --k-S: #975A00;
  --k-F: #2A5BA5;
  --k-B: #6948A3;
  --k-M: #067F3E;
  --k-C: #0D6B62;
  --k-X: #B3261E;
  --ok: #117347;
  --fail: #BC3227;
  --fail-soft: #FBE5E2;
  --skip: #87918D;
  --on-state: #FFFFFF;
  --bubble: #D9F4E2;
  --bubble-ink: #0F2E1B;
  --warn-bg: #FFF2D3;
  --warn-ink: #6B4200;
  --shadow: 0 1px 2px rgba(14, 40, 36, .06), 0 8px 24px rgba(14, 40, 36, .07);
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0F1514;
    --surface: #161F1D;
    --surface-2: #1E2927;
    --ink: #E3ECE9;
    --muted: #97A8A3;
    --line: #2B3936;
    --accent: #52B8AC;
    --accent-ink: #06201D;
    --accent-soft: #163632;
    --k-S: #E0A34A;
    --k-F: #86ACEB;
    --k-B: #BBA2EE;
    --k-M: #55D18C;
    --k-C: #52B8AC;
    --k-X: #F08274;
    --ok: #4FC98C;
    --fail: #F08274;
    --fail-soft: #3A1D1A;
    --skip: #7C8A86;
    --on-state: #0B1413;
    --bubble: #1B3B2A;
    --bubble-ink: #DDF3E5;
    --warn-bg: #3A2E14;
    --warn-ink: #F3CD84;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0F1514;
  --surface: #161F1D;
  --surface-2: #1E2927;
  --ink: #E3ECE9;
  --muted: #97A8A3;
  --line: #2B3936;
  --accent: #52B8AC;
  --accent-ink: #06201D;
  --accent-soft: #163632;
  --k-S: #E0A34A;
  --k-F: #86ACEB;
  --k-B: #BBA2EE;
  --k-M: #55D18C;
  --k-C: #52B8AC;
  --k-X: #F08274;
  --ok: #4FC98C;
  --fail: #F08274;
  --fail-soft: #3A1D1A;
  --skip: #7C8A86;
  --on-state: #0B1413;
  --bubble: #1B3B2A;
  --bubble-ink: #DDF3E5;
  --warn-bg: #3A2E14;
  --warn-ink: #F3CD84;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.65 var(--font);
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; }
@media (min-width: 700px) { .wrap { padding-inline: 28px; } }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ===== 頁首 ===== */
header.top {
  display: flex; flex-wrap: wrap; gap: 12px 28px;
  align-items: flex-end; justify-content: space-between;
  padding-bottom: 14px; border-bottom: 1px solid var(--line);
}
.brand h1 { margin: 0; font-size: 1.55rem; font-weight: 700; letter-spacing: .03em; line-height: 1.3; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
.tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.field { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
.field input { width: 9.5em; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.t-ok { color: var(--ok); }
.t-fail { color: var(--fail); }
.howto { margin: 12px 0 20px; font-size: .88rem; color: var(--muted); max-width: 62em; }

input[type="text"], textarea, select {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  max-width: 100%;
}
textarea { width: 100%; resize: vertical; line-height: 1.55; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn {
  font: inherit; font-size: .9rem; line-height: 1.4;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 6px 13px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: default; border-color: var(--line); }
.btn.small { padding: 3px 9px; font-size: .8rem; }
.btn.ghost { background: transparent; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.danger { background: var(--fail); border-color: var(--fail); color: var(--on-state); font-weight: 500; }
.btn.bad { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 45%, var(--line)); }
.btn.bad:hover { border-color: var(--fail); }
@media (prefers-reduced-motion: no-preference) {
  .btn, .case-btn { transition: background-color .12s, border-color .12s, color .12s; }
}

/* ===== 版面 ===== */
.picker { display: none; margin-bottom: 18px; }
.picker select { width: 100%; }
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px; align-items: start; }
.rail {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px);
  max-height: calc(100vh - 24px); overflow: auto; padding-right: 4px;
}
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .picker { display: block; }
}

/* ===== 情況清單 ===== */
.flow + .flow { margin-top: 18px; }
.flow h2 {
  display: flex; justify-content: space-between; align-items: baseline;
  margin: 0 0 4px; padding: 0 8px;
  font-size: .8rem; font-weight: 700; letter-spacing: .08em; color: var(--muted);
}
.fc { font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.flow ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.case-btn {
  width: 100%; display: grid; grid-template-columns: 1.3rem 9px minmax(0, 1fr) auto;
  gap: 8px; align-items: center; text-align: left;
  font: inherit; font-size: .88rem; line-height: 1.45; color: var(--ink);
  background: transparent; border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer;
}
.case-btn:hover { background: var(--surface-2); }
.case-btn[aria-current="true"] { background: var(--accent-soft); font-weight: 500; }
.cn { font-family: var(--mono); font-size: .78rem; color: var(--muted); text-align: right; }
.cc { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--skip); }
.st-run .dot { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
.st-done .dot { border-color: var(--ok); background: var(--ok); }
.st-fail .dot { border-color: var(--fail); background: var(--fail); }

/* ===== 情況標頭 ===== */
.case-head { display: grid; gap: 6px; margin-bottom: 14px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .82rem; color: var(--muted); letter-spacing: .05em; }
.tag { font-size: .72rem; font-weight: 700; letter-spacing: .04em; padding: 0 7px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); }
.case-head h2 { margin: 0; font-size: 1.5rem; line-height: 1.35; text-wrap: balance; }
.prog { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.bar { flex: 1 1 200px; height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.b-ok { background: var(--ok); }
.b-fail { background: var(--fail); }
.b-skip { background: var(--skip); }
.prog-num { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.intro { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; font-size: .9rem; margin-bottom: 12px; max-width: 62em; }

/* ===== 下一步 ===== */
.next {
  background: var(--surface); border: 1.5px solid var(--accent); border-radius: 14px;
  box-shadow: var(--shadow); padding: 16px 18px 18px; margin: 18px 0 8px;
}
.next.is-failing { border-color: var(--fail); }
.next.is-done { border-color: var(--ok); }
.next-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.next-label { font-size: .82rem; font-weight: 700; letter-spacing: .12em; color: var(--accent); }
.is-failing .next-label { color: var(--fail); }
.is-done .next-label { color: var(--ok); }
.next-pos { font-family: var(--mono); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.next .text { font-size: 1.15rem; font-weight: 500; line-height: 1.5; }
.next .bubble { font-size: 1rem; }
.look { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.look h3 { margin: 0 0 6px; font-size: .8rem; font-weight: 500; letter-spacing: .06em; color: var(--muted); }
.look ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.look li { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: .9rem; }
.qline { color: var(--muted); margin-left: 4px; }
.none { margin: 0; font-size: .88rem; color: var(--muted); }
.fail-label { display: block; margin: 14px 0 6px; font-size: .85rem; color: var(--muted); }
.next-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
.next-acts .btn { padding: 9px 16px; font-size: .95rem; }
.next-acts .spacer { flex: 1; }
.done-sum { margin: 0; font-size: 1rem; }
@media (max-width: 620px) {
  .next { padding: 14px; }
  .next-acts .btn { flex: 1 1 auto; }
  .next-acts .spacer { display: none; }
}

/* ===== 步驟內容 ===== */
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-bottom: 3px; }
.kind {
  display: inline-flex; align-items: center; white-space: nowrap;
  font-size: .74rem; font-weight: 500; letter-spacing: .04em; line-height: 1.6;
  padding: 0 8px; border-radius: 999px; color: var(--kc);
  background: color-mix(in srgb, var(--kc) 11%, transparent);
  border: 1px solid color-mix(in srgb, var(--kc) 32%, transparent);
}
.k-S { --kc: var(--k-S); }
.k-F { --kc: var(--k-F); }
.k-B { --kc: var(--k-B); }
.k-M { --kc: var(--k-M); }
.k-C { --kc: var(--k-C); }
.k-X { --kc: var(--k-X); }
.who { font-size: .86rem; font-weight: 700; }
.endtag { font-size: .72rem; font-weight: 700; padding: 0 7px; border-radius: 4px; background: var(--ink); color: var(--ground); line-height: 1.6; }
.chip {
  display: inline-block; padding: 0 6px; margin: 0 2px; border-radius: 5px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-weight: 500; font-size: .92em; line-height: 1.5;
}
.ph { display: inline-block; padding: 0 5px; margin: 0 1px; border: 1px dashed currentColor; border-radius: 4px; font-size: .9em; line-height: 1.4; opacity: .85; }
.bubble {
  margin-top: 6px; display: inline-block; max-width: min(100%, 34rem);
  background: var(--bubble); color: var(--bubble-ink);
  border-radius: 16px 16px 16px 4px; padding: 8px 14px;
  font-size: .92rem; line-height: 1.6; overflow-wrap: anywhere;
}
.bubble b { font-weight: 700; }
.cap { margin: 4px 0 0; font-size: .75rem; color: var(--muted); }
.hints { margin: 6px 0 0; padding-left: 1.15em; font-size: .85rem; color: var(--muted); }
.warn { margin: 8px 0 0; background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 6px 10px; font-size: .86rem; }
.warn b { margin-right: 8px; }
.linkish {
  display: inline-block; margin-top: 6px; padding: 0; border: 0; background: none;
  color: var(--accent); font: inherit; font-size: .85rem; cursor: pointer;
  text-decoration: underline; text-underline-offset: 2px;
}

/* ===== 步驟清單 ===== */
.list-h { margin: 28px 0 8px; font-size: .8rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.step { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) auto; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.steps > li:first-child { border-top: 0; }
.num { font-family: var(--mono); font-size: .82rem; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.mark { display: block; font-family: var(--font); font-size: .95rem; font-weight: 700; line-height: 1.3; }
.step.is-current { background: var(--accent-soft); }
.step.is-current .num { color: var(--accent); font-weight: 600; }
.step.is-ok .mark { color: var(--ok); }
.step.is-fail { background: var(--fail-soft); }
.step.is-fail .mark { color: var(--fail); }
.step.is-skip .mark { color: var(--skip); font-size: .8rem; }
.step.is-ok .text, .step.is-skip .text { color: var(--muted); }
.step.is-ok .bubble, .step.is-skip .bubble { opacity: .7; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; justify-content: flex-end; }
.acts .btn[aria-pressed="true"].m-ok { background: var(--ok); border-color: var(--ok); color: var(--on-state); }
.acts .btn[aria-pressed="true"].m-fail { background: var(--fail); border-color: var(--fail); color: var(--on-state); }
.acts .btn[aria-pressed="true"].m-skip { background: var(--skip); border-color: var(--skip); color: var(--on-state); }
.note-box { margin-top: 8px; }
.note-box label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 3px; }
.seg {
  display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline;
  padding: 7px 14px; background: var(--surface-2); border-top: 1px solid var(--line);
  font-size: .8rem; color: var(--muted);
}
.seg-t { font-weight: 700; letter-spacing: .04em; }
@media (max-width: 620px) {
  .step { grid-template-columns: 1.9rem minmax(0, 1fr); }
  .acts { grid-column: 2; justify-content: flex-start; }
}

/* ===== 接續與參考 ===== */
.cont {
  margin-top: 14px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 10px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .9rem;
}
.cont > span { margin-right: 4px; }
.next .cont { margin-top: 12px; }
.refs { display: grid; gap: 8px; }
details.ref { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; }
details.ref summary { cursor: pointer; padding: 10px 0; font-weight: 500; }
details.ref[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 10px; }
details.ref p { margin: 0 0 10px; font-size: .9rem; }
.plain { margin: 0 0 12px; padding-left: 1.15em; font-size: .9rem; display: grid; gap: 6px; }
.plain ul { margin: 4px 0 0; padding-left: 1.15em; }
.legend-list { list-style: none; padding-left: 0; }
.legend-list li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.tbl { overflow-x: auto; margin-bottom: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 34rem; font-size: .88rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .8rem; font-weight: 700; color: var(--muted); white-space: nowrap; }

/* ===== 測試紀錄 ===== */
dialog {
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink);
  padding: 18px; width: min(720px, calc(100vw - 32px)); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10, 20, 18, .45); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dlg-head h2 { margin: 0; font-size: 1.15rem; }
.dlg-note { margin: 8px 0 12px; font-size: .85rem; color: var(--muted); }
#reportText { min-height: 320px; font-size: .85rem; }
.dlg-acts { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 12px; }
.dlg-acts .spacer { flex: 1; }
.copy-msg { font-size: .85rem; color: var(--ok); }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>通報流程測試導引</h1>
      <p>依 FolwTest/plan.md 整理（2026-09-19）・緊急醫療、第一／二／三類優化計畫、跨流程共 33 個情況</p>
    </div>
    <div class="tools">
      <label class="field" for="tester">測試人員 <input id="tester" type="text" placeholder="姓名" autocomplete="name"></label>
      <span id="stats" class="stats" aria-live="polite"></span>
      <button type="button" class="btn" data-act="report">測試紀錄</button>
    </div>
  </header>
  <p class="howto">照「下一步」做：操作做完按「完成」；LINE 訊息或後台畫面和預期一樣按「符合」，不一樣按「不符合」並寫下實際看到什麼。用不到的步驟按「略過」。進度會自動存在這個瀏覽器，測完按右上角「測試紀錄」複製結果回報。</p>
  <div class="picker"><label for="casePick" class="sr">選擇要測的情況</label><select id="casePick"></select></div>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="測試情況"></nav>
    <main id="runner"></main>
  </div>
  <noscript><p>這個頁面需要開啟 JavaScript 才能使用。</p></noscript>
</div>

<dialog id="reportDlg" aria-labelledby="reportTitle">
  <div class="dlg-head">
    <h2 id="reportTitle">測試紀錄</h2>
    <button type="button" class="btn ghost" data-act="close">關閉</button>
  </div>
  <p class="dlg-note">進度只存在這台電腦的這個瀏覽器裡。測完請複製下面的紀錄回報；換電腦、用無痕視窗或清除瀏覽資料，進度就不會在。</p>
  <label for="reportText" class="sr">測試紀錄內容</label>
  <textarea id="reportText" readonly rows="16"></textarea>
  <div class="dlg-acts">
    <button type="button" class="btn primary" data-act="copy">複製紀錄</button>
    <span id="copyMsg" class="copy-msg" role="status"></span>
    <span class="spacer"></span>
    <button type="button" class="btn bad" data-act="wipe" data-arm>清除全部進度</button>
  </div>
</dialog>

<script>
(() => {
  'use strict';

  // ===== 小工具 =====
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  // [選項] 顯示成選項標籤，{欄位} 顯示成「依實際內容」的佔位框
  const fmt = (s) => esc(s)
    .replace(/\[([^\]]+)\]/g, '<span class="chip">$1</span>')
    .replace(/\{([^}]+)\}/g, '<span class="ph">$1</span>');

  // ===== 步驟 =====
  // S 前提 / F 前台操作 / B 後台操作 / M 收到 LINE / C 後台確認 / X 不應發生
  const mk = (k) => (who, text, o) => Object.assign({ k, who, text }, o || {});
  const S = mk('S'), F = mk('F'), B = mk('B'), M = mk('M'), C = mk('C'), X = mk('X');
  const BE = (who, text, o) => B(who, text, Object.assign({ end: true }, o || {}));
  const seg = (text, hint) => ({ k: 'seg', text, hint });

    if (hints.length) h += `<ul class="hints">${hints.map((x) => `<li>${fmt(x)}</li>`).join('')}</ul>`;
    if (s.warn) h += `<p class="warn"><b>注意</b>${fmt(s.warn)}</p>`;
    if (s.ref) h += `<button type="button" class="linkish" data-act="ref" data-ref="${s.ref}">見〈${esc(REFS[s.ref].short)}〉</button>`;
    return h;
  }

  const caseLabel = (id) => `${esc(FLOW_OF[id].name)} ${CASES[id].n}. ${esc(CASES[id].title)}`;
  const contBlock = (n) => `<div class="cont"><span>${esc(n.text)}</span>${n.links.map((id) => `<button type="button" class="btn small" data-act="case" data-case="${id}">${caseLabel(id)}</button>`).join('')}</div>`;

  function renderNext(c, cur, nums, total) {
    const r = peek(c.id);
    if (failDraft && failDraft.id === c.id) {
      const i = failDraft.idx, s = c.steps[i];
      return `<section class="next is-failing" aria-label="記錄問題">
        <div class="next-top"><span class="next-label">記錄問題</span><span class="next-pos">步驟 ${nums[i]} / ${total}</span></div>
        ${stepBody(s, true)}
        <label class="fail-label" for="failNote">實際看到什麼？例如收到的訊息內容、少了哪個標籤、卡在哪個畫面。可以先空著，之後在下方步驟清單補。</label>
        <textarea id="failNote" rows="3">${esc(r.n[i] || '')}</textarea>
        <div class="next-acts">
          <button type="button" class="btn danger" data-act="fail-save" data-idx="${i}">記下問題，繼續下一步</button>
          <button type="button" class="btn" data-act="fail-cancel">取消</button>
        </div>
      </section>`;
    }
    const canUndo = undoTarget(c) !== undefined;
    const undoBtn = `<button type="button" class="btn ghost" data-act="undo"${canUndo ? '' : ' disabled'}>上一步</button>`;
    if (cur === undefined) {
      const s = stat(c);
      const nextId = ORDER[ORDER.indexOf(c.id) + 1];
      return `<section class="next is-done" aria-live="polite">
        <div class="next-top"><span class="next-label">這個情況走完了</span></div>
        <p class="done-sum">符合／完成 <b>${s.ok}</b> 步・有問題 <b class="t-fail">${s.fail}</b> 步・略過 <b>${s.skip}</b> 步</p>
        ${c.next ? contBlock(c.next) : ''}
        <div class="next-acts">
          ${nextId ? `<button type="button" class="btn primary" data-act="case" data-case="${nextId}">下一個情況：${caseLabel(nextId)}</button>` : ''}
          <button type="button" class="btn" data-act="report">產生測試紀錄</button>
          <span class="spacer"></span>${undoBtn}
        </div>
      </section>`;
    }
    const s = c.steps[cur];
    const [okL, failL] = labels(s.k, true);
    let look = '';
    if (isAction(s.k)) {
      const items = [];
      for (let j = cur + 1; j < c.steps.length; j++) {
        const t = c.steps[j];
        if (t.k === 'seg') continue;
        if (isAction(t.k)) break;
        items.push(t);
      }
      look = `<div class="look"><h3>做完這一步後要檢查</h3>${items.length
        ? `<ul>${items.map((t) => `<li><span class="kind k-${t.k}">${KIND[t.k]}</span>${t.who ? `<span class="who">${esc(t.who)}</span>` : ''}<span>${fmt(t.text)}${t.q ? `<span class="qline">「${fmt(t.q.split('\n')[0])}」</span>` : ''}</span></li>`).join('')}</ul>`
        : '<p class="none">沒有要另外檢查的項目，做完直接按「完成」。</p>'}</div>`;
    }
    return `<section class="next" aria-live="polite">
      <div class="next-top"><span class="next-label">下一步</span><span class="next-pos">步驟 ${nums[cur]} / ${total}</span></div>
      ${stepBody(s, true)}
      ${look}
      <div class="next-acts">
        <button type="button" class="btn primary" data-act="next-ok" data-idx="${cur}">${okL}</button>
        <button type="button" class="btn bad" data-act="next-fail" data-idx="${cur}">${failL}</button>
        <button type="button" class="btn" data-act="next-skip" data-idx="${cur}">略過</button>
        <span class="spacer"></span>${undoBtn}
      </div>
    </section>`;
  }

  function row(c, i, s, num, r, isCur) {
    if (s.k === 'seg') {
      return `<li class="seg"><span class="seg-t">${esc(s.text)}</span>${s.hint ? `<span>${fmt(s.hint)}</span>` : ''}</li>`;
    }
    const v = r.s[i];
    const [okL, failL] = labels(s.k, false);
    const mark = v === 'ok' ? '✓' : v === 'fail' ? '✗' : v === 'skip' ? '略過' : '';
    const btn = (val, label, cls) => `<button type="button" class="btn small ${cls}" data-act="mark" data-idx="${i}" data-v="${val}" aria-pressed="${v === val}">${label}</button>`;
    const noteId = `note-${c.id}-${i}`;
    return `<li class="step${v ? ' is-' + v : ''}${isCur ? ' is-current' : ''}">
      <div class="num">${String(num).padStart(2, '0')}${mark ? `<span class="mark">${mark}</span>` : ''}</div>
      <div class="body">${stepBody(s, false)}${v === 'fail'
        ? `<div class="note-box"><label for="${noteId}">問題說明</label><textarea id="${noteId}" data-note="${i}" rows="2" placeholder="實際看到什麼？">${esc(r.n[i] || '')}</textarea></div>`
        : ''}</div>
      <div class="acts">${btn('ok', okL, 'm-ok')}${btn('fail', failL, 'm-fail')}${btn('skip', '略過', 'm-skip')}</div>
    </li>`;
  }

  function renderStats() {
    const t = { todo: 0, run: 0, done: 0, fail: 0 };
    ORDER.forEach((id) => { t[stat(CASES[id]).status]++; });
    $('#stats').innerHTML = `<span class="t-ok">完成 ${t.done}</span><span class="t-fail">有問題 ${t.fail}</span><span>進行中 ${t.run}</span><span>未開始 ${t.todo}</span>`;
  }

  function renderRail() {
    $('#rail').innerHTML = FLOWS.map((f) => {
      const done = f.cases.filter((c) => stat(c).status === 'done').length;
      return `<section class="flow"><h2><span>${esc(f.name)}</span><span class="fc" title="已完成的情況">${done}/${f.cases.length}</span></h2><ul>${f.cases.map((c) => {
        const s = stat(c);
        return `<li><button type="button" class="case-btn st-${s.status}" data-act="case" data-case="${c.id}" aria-current="${c.id === state.cur}"><span class="cn">${c.n}</span><span class="dot" aria-hidden="true"></span><span class="ct">${esc(c.title)}<span class="sr">（${STATUS_LABEL[s.status]}）</span></span><span class="cc">${s.marked}/${s.total}</span></button></li>`;
      }).join('')}</ul></section>`;
    }).join('');
  }

  function renderPicker() {
    const sel = $('#casePick');
    sel.innerHTML = FLOWS.map((f) => `<optgroup label="${esc(f.name)}">${f.cases.map((c) => {
      const s = stat(c);
      return `<option value="${c.id}">${c.n}. ${esc(c.title)}（${STATUS_LABEL[s.status]} ${s.marked}/${s.total}）</option>`;
    }).join('')}</optgroup>`).join('');
    sel.value = state.cur;
  }

  function renderRunner() {
    const c = CASES[state.cur], f = FLOW_OF[c.id];
    const r = peek(c.id), s = stat(c), cur = currentIdx(c);
    const nums = {};
    let n = 0;
    c.steps.forEach((st, i) => { if (st.k !== 'seg') nums[i] = ++n; });
    const pct = (x) => (s.total ? (x / s.total) * 100 : 0).toFixed(2);
    let h = `<div class="case-head">
      <div class="eyebrow"><span>${esc(f.name)}・情況 ${c.n}</span>${c.tag ? `<span class="tag">${esc(c.tag)}</span>` : ''}</div>
      <h2>${esc(c.title)}</h2>
      <div class="prog">
        <div class="bar" role="img" aria-label="已標記 ${s.marked} / ${s.total} 步"><i class="b-ok" style="width:${pct(s.ok)}%"></i><i class="b-fail" style="width:${pct(s.fail)}%"></i><i class="b-skip" style="width:${pct(s.skip)}%"></i></div>
        <span class="prog-num">${s.marked} / ${s.total} 步${s.fail ? `・<span class="t-fail">${s.fail} 個問題</span>` : ''}</span>
        <button type="button" class="btn small ghost" data-act="reset" data-arm>重設這個情況</button>
      </div>
    </div>`;
    if (f.intro) h += `<div class="intro">${f.intro}</div>`;
    if (c.note) h += `<div class="intro">${fmt(c.note)}</div>`;
    h += renderNext(c, cur, nums, s.total);
    h += `<h3 class="list-h">全部步驟</h3><ol class="steps">${c.steps.map((st, i) => row(c, i, st, nums[i], r, i === cur)).join('')}</ol>`;
    if (c.next) h += contBlock(c.next);
    const refs = [...(c.refs || []), ...(f.refs || []), 'vars', 'docnurse', 'legend'];
    h += `<h3 class="list-h">參考</h3><div class="refs">${refs.map((k) => `<details class="ref" id="ref-${k}"${openRefs.has(k) ? ' open' : ''}><summary>${esc(REFS[k].title)}</summary>${REFS[k].html}</details>`).join('')}</div>`;
    $('#runner').innerHTML = h;
  }

  function render() {
    renderStats();
    renderRail();
    renderPicker();
    renderRunner();
    if (focusAfter) {
      const el = document.getElementById(focusAfter);
      focusAfter = null;
      if (el) el.focus({ preventScroll: true });
    }
  }

  // ===== 操作 =====
  function setStatus(id, i, v) {
    const r = rec(id);
    if (v) r.s[i] = v; else delete r.s[i];
    save();
  }

  function select(id) {
    if (!CASES[id]) return;
    state.cur = id;
    failDraft = null;
    save();
    try { history.replaceState(null, '', '#' + id); } catch (e) { /* 預覽環境可能不允許改網址 */ }
    render();
    const runner = $('#runner');
    if (runner.getBoundingClientRect().top < 0) runner.scrollIntoView({ block: 'start' });
  }

  // 危險的按鈕要按兩次
  function armed(b) {
    if (b.dataset.armed === '1') return true;
    b.dataset.armed = '1';
    b.dataset.label = b.textContent;
    b.textContent = '再按一次確認';
    clearTimeout(b._armTimer);
    b._armTimer = setTimeout(() => {
      b.dataset.armed = '';
      b.textContent = b.dataset.label;
    }, 3000);
    return false;
  }

  function stamp(d) {
    const p = (x) => String(x).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function buildReport() {
    const t = { todo: 0, run: 0, done: 0, fail: 0 };
    ORDER.forEach((id) => { t[stat(CASES[id]).status]++; });
    const L = [
      '通報流程測試紀錄',
      `測試人員：${state.tester.trim() || '（未填）'}`,
      `產生時間：${stamp(new Date())}`,
      `情況：完成 ${t.done}・有問題 ${t.fail}・進行中 ${t.run}・未開始 ${t.todo}（共 ${ORDER.length}）`,
    ];
    let any = false;
    FLOWS.forEach((f) => {
      const touched = f.cases.filter((c) => stat(c).marked > 0);
      if (!touched.length) return;
      any = true;
      L.push('', `■ ${f.name}`);
      touched.forEach((c) => {
        const s = stat(c), r = peek(c.id);
        L.push(`  [${STATUS_LABEL[s.status]}] 情況 ${c.n}. ${c.title}（${s.marked}/${s.total} 步${s.skip ? `，略過 ${s.skip}` : ''}）`);
        let n = 0;
        c.steps.forEach((st, i) => {
          if (st.k === 'seg') return;
          n++;
          if (r.s[i] !== 'fail') return;
          L.push(`    ✗ 步驟 ${n}｜${KIND[st.k]}${st.who ? '｜' + st.who : ''}：${st.text}${st.q ? `（預期：${st.q.replace(/\n/g, ' ／ ')}）` : ''}`);
          L.push(`      問題：${(r.n[i] || '').trim() || '（未填說明）'}`);
        });
      });
    });
    if (!any) L.push('', '（還沒有任何測試紀錄）');
    return L.join('\n');
  }

  function openReport() {
    $('#reportText').value = buildReport();
    $('#copyMsg').textContent = '';
    const d = $('#reportDlg');
    try { d.showModal(); } catch (e) { d.setAttribute('open', ''); }
  }
  function closeReport() {
    const d = $('#reportDlg');
    try { d.close(); } catch (e) { d.removeAttribute('open'); }
  }
  async function copyReport() {
    const t = $('#reportText'), msg = $('#copyMsg');
    try {
      await navigator.clipboard.writeText(t.value);
      msg.textContent = '已複製，可以直接貼到回報的地方';
      return;
    } catch (e) { /* 改用選取的方式 */ }
    t.focus();
    t.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    msg.textContent = ok ? '已複製，可以直接貼到回報的地方' : '瀏覽器不讓網頁自動複製，已經幫你全選，請按 Ctrl+C（Mac 按 ⌘C）';
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const c = CASES[state.cur];
    const act = b.dataset.act;
    if (act === 'case') { select(b.dataset.case); return; }
    if (act === 'mark') {
      const i = Number(b.dataset.idx), v = b.dataset.v;
      const now = peek(c.id).s[i];
      setStatus(c.id, i, now === v ? null : v);
      if (v === 'fail' && now !== v) focusAfter = `note-${c.id}-${i}`;
      if (failDraft && failDraft.idx === i) failDraft = null;
      render();
      return;
    }
    if (act === 'next-ok' || act === 'next-skip') {
      setStatus(c.id, Number(b.dataset.idx), act === 'next-ok' ? 'ok' : 'skip');
      render();
      return;
    }
    if (act === 'next-fail') {
      failDraft = { id: c.id, idx: Number(b.dataset.idx) };
      focusAfter = 'failNote';
      render();
      return;
    }
    if (act === 'fail-save') {
      const i = Number(b.dataset.idx), r = rec(c.id), t = $('#failNote');
      const note = t ? t.value.trim() : '';
      r.s[i] = 'fail';
      if (note) r.n[i] = note; else delete r.n[i];
      save();
      failDraft = null;
      render();
      return;
    }
    if (act === 'fail-cancel') { failDraft = null; render(); return; }
    if (act === 'undo') {
      const i = undoTarget(c);
      if (i !== undefined) setStatus(c.id, i, null);
      render();
      return;
    }
    if (act === 'reset') {
      if (!armed(b)) return;
      delete state.cases[c.id];
      failDraft = null;
      save();
      render();
      return;
    }
    if (act === 'ref') {
      const k = b.dataset.ref, d = document.getElementById('ref-' + k);
      if (d) { d.open = true; openRefs.add(k); d.scrollIntoView({ block: 'start' }); }
      return;
    }
    if (act === 'report') { openReport(); return; }
    if (act === 'close') { closeReport(); return; }
    if (act === 'copy') { copyReport(); return; }
    if (act === 'wipe') {
      if (!armed(b)) return;
      state.cases = {};
      failDraft = null;
      save();
      $('#reportText').value = buildReport();
      render();
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'tester') { state.tester = t.value; save(); return; }
    if (t.dataset && t.dataset.note !== undefined) {
      const r = rec(state.cur);
      if (t.value.trim()) r.n[t.dataset.note] = t.value; else delete r.n[t.dataset.note];
      save();
    }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'casePick') select(e.target.value);
  });

  document.addEventListener('toggle', (e) => {
    const d = e.target;
    if (d.matches && d.matches('details.ref')) {
      const k = d.id.slice(4);
      if (d.open) openRefs.add(k); else openRefs.delete(k);
    }
  }, true);

  $('#tester').value = state.tester;
  render();
})();
</script>

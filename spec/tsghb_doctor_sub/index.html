<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>醫師次專科 — 編輯資料頁原型</title>
<style>
  :root{
    /* 與原型頁共用的設計 token */
    --teal-50:#D0FCF9;--teal-300:#19AAD1;--teal-500:#1285B3;--teal-700:#0C6496;
    --grey-0:#FFFFFF;--grey-100:#F0F0F0;--grey-200:#E0E0E0;--grey-400:#C4C4C4;
    --grey-600:#818181;--grey-700:#666666;--grey-900:#333333;
    --radius-md:4px;
    --shadow-card:0px 4px 6px -4px rgba(0,0,0,.1),0px 10px 15px -3px rgba(0,0,0,.1);
    --font-body:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:flex;flex-direction:column;
    background:var(--grey-100);color:var(--grey-900);font-family:var(--font-body);
  }

  /* ---------- 上方切換列 ---------- */
  .bar{
    flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;
    background:var(--grey-0);box-shadow:inset 0 -1px 0 var(--grey-200);
  }
  .bar-title{flex:1;min-width:220px}
  h1{margin:0;font-size:16px;line-height:1.4;font-weight:700}
  .sub{margin:2px 0 0;font-size:12px;line-height:1.5;color:var(--grey-700)}

  .seg{display:inline-flex;padding:3px;border-radius:6px;background:var(--grey-100)}
  .seg button{
    height:30px;padding:0 14px;border:0;border-radius:var(--radius-md);background:transparent;
    font:inherit;font-size:14px;color:var(--grey-700);cursor:pointer;
  }
  .seg button:hover{color:var(--grey-900)}
  .seg button[aria-pressed="true"]{background:var(--teal-300);color:var(--grey-0);font-weight:700}
  .seg button:focus-visible,.open:focus-visible{outline:2px solid var(--teal-700);outline-offset:2px}
  .open{
    display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:var(--radius-md);
    box-shadow:inset 0 0 0 1px var(--teal-300);color:var(--teal-500);font-size:14px;text-decoration:none;
  }
  .open:hover{background:var(--teal-50)}

  /* ---------- 預覽區 ---------- */
  .stage{flex:1;min-height:0;display:flex;justify-content:center}
  .stage iframe{display:block;width:100%;height:100%;border:0;background:var(--grey-0)}
  /* 手機：固定 375 寬，寬度就是兩頁設計稿的手機稿 */
  .stage[data-device="mobile"]{padding:20px 16px}
  .stage[data-device="mobile"] iframe{
    width:375px;max-width:100%;max-height:812px;border-radius:12px;
    box-shadow:inset 0 0 0 1px var(--grey-200),var(--shadow-card);
  }

  /* 視窗本身就是手機寬的時候，不需要再選裝置寬度 */
  @media (max-width:700px){
    .seg--device{display:none}
    .stage[data-device="mobile"]{padding:0}
    .stage[data-device="mobile"] iframe{width:100%;max-height:none;border-radius:0;box-shadow:none}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-title">
    <h1>醫師次專科 — 編輯資料頁</h1>
    <p class="sub">三軍總醫院北投分院 精神醫療快速應變平台｜帳號資料新增「次專科」多選欄位，前臺與後臺是同一份資料。</p>
  </div>
  <div class="seg" role="group" aria-label="頁面">
    <button type="button" data-page="front">通報前臺</button>
    <button type="button" data-page="back">後臺</button>
  </div>
  <div class="seg seg--device" role="group" aria-label="裝置寬度">
    <button type="button" data-device="desktop">電腦</button>
    <button type="button" data-device="mobile">手機</button>
  </div>
  <a class="open" id="open" href="./front/index.html" target="_blank" rel="noopener">
    開新分頁
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
  </a>
</header>

<main class="stage" id="stage" data-device="desktop">
  <iframe id="view" title="通報前臺 編輯帳號" src="./front/index.html"></iframe>
</main>

<script>
(function () {
  "use strict";

  // 路徑寫到 index.html，本機用 file:// 開也能載入
  var PAGES = {
    front: { src: "./front/index.html", title: "通報前臺 編輯帳號" },
    back: { src: "./back/index.html", title: "後臺 基本資料" }
  };

  var stage = document.getElementById("stage");
  var view = document.getElementById("view");
  var open = document.getElementById("open");
  var state = { page: "front", device: "desktop" };

  // 網址 # 記住目前看的頁面與寬度，例如 #back/mobile；格式不對就維持原狀
  function readHash() {
    var m = /^#(front|back)(?:\/(desktop|mobile))?$/.exec(location.hash);
    if (!m) return;
    state.page = m[1];
    state.device = m[2] || "desktop";
  }

  function render() {
    var page = PAGES[state.page];
    // 只切寬度時不要重設 src，頁面上填到一半的內容才不會被重新載入清掉
    if (view.getAttribute("src") !== page.src) view.setAttribute("src", page.src);
    view.title = page.title;
    open.href = page.src;
    stage.setAttribute("data-device", state.device);
    document.querySelectorAll(".seg button").forEach(function (btn) {
      var on = btn.getAttribute("data-page") === state.page || btn.getAttribute("data-device") === state.device;
      btn.setAttribute("aria-pressed", String(on));
    });
  }

  document.querySelectorAll(".seg button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.page = btn.getAttribute("data-page") || state.page;
      state.device = btn.getAttribute("data-device") || state.device;
      history.replaceState(null, "", "#" + state.page + (state.device === "mobile" ? "/mobile" : ""));
      render();
    });
  });

  window.addEventListener("hashchange", function () { readHash(); render(); });
  readHash();
  render();
})();
</script>
</body>
</html>

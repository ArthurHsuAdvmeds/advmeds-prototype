<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小工具</title>
<meta name="robots" content="noindex">

<!--
  ============================================================================
  小工具入口：列出這個資料夾底下的工具
  ----------------------------------------------------------------------------
  新增工具時：開一個子資料夾放 index.html，再到下面複製一張 .card。
  設計 token 與按鈕等共用樣式在 ./assets/tool.css。
  ============================================================================
-->

<link rel="stylesheet" href="./assets/tool.css?v=20261012">
<style>
  body{min-height:100vh;padding:56px 20px 64px}
  .wrap{max-width:960px;margin:0 auto}
  .back{display:inline-block;margin-bottom:18px}
  h1{margin:0 0 8px;font-size:26px;font-weight:700}
  .sub{font-size:14px;color:var(--ink-2);line-height:1.7;max-width:640px}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:28px}
  @media (max-width:720px){ .grid{grid-template-columns:1fr} }

  /* 整張卡片可點：連結的 ::after 撐滿卡片 */
  .card{
    position:relative;display:flex;flex-direction:column;
    background:var(--panel);border-radius:var(--radius-lg);
    box-shadow:inset 0 0 0 1px var(--line),var(--shadow-card);
    padding:20px 22px;transition:box-shadow .15s,transform .15s;
  }
  .card:hover{box-shadow:inset 0 0 0 1px var(--accent),var(--shadow-card);transform:translateY(-1px)}
  .card:focus-within{box-shadow:inset 0 0 0 1px var(--accent),var(--shadow-card)}
  .row{display:flex;align-items:flex-start;gap:14px}
  .icon{
    flex-shrink:0;width:40px;height:40px;border-radius:var(--radius-lg);
    display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent-ink);
  }
  .body{flex:1;min-width:0}
  .main{display:inline-block;margin-bottom:4px;font-size:16px;font-weight:700;color:inherit;text-decoration:none}
  .main::after{content:"";position:absolute;inset:0;border-radius:var(--radius-lg)}
  .main:focus-visible{outline:none}
  .main:focus-visible::after{outline:2px solid var(--accent);outline-offset:2px}
  .desc{font-size:13px;color:var(--ink-2);line-height:1.65}
  .chev{flex-shrink:0;margin-top:10px;color:var(--grey-400);transition:transform .15s,color .15s}
  .card:hover .chev{color:var(--accent);transform:translateX(2px)}
  .foot{margin-top:auto;padding-top:14px}
  code{
    font-family:var(--font-mono);font-size:12px;color:var(--ink-3);
    background:var(--chip-bg);padding:2px 6px;border-radius:var(--radius-md);
  }
  footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);line-height:1.9}

  @media (prefers-reduced-motion:reduce){
    .card,.chev{transition:none}
    .card:hover,.card:hover .chev{transform:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="back" href="../">← 原型總覽</a>
    <h1>小工具</h1>
    <div class="sub">開發時順手會用到的小工具。全部在瀏覽器裡執行，貼進來的資料不會上傳，也不會存下來。</div>
  </header>

  <div class="grid">

    <div class="card">
      <div class="row">
        <div class="icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 4c-2 0-3 1-3 3v2c0 1.5-.7 2.5-2 3 1.3.5 2 1.5 2 3v2c0 2 1 3 3 3M16 4c2 0 3 1 3 3v2c0 1.5.7 2.5 2 3-1.3.5-2 1.5-2 3v2c0 2-1 3-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="body">
          <a class="main" href="./json_format/">JSON 美化</a>
          <div class="desc">貼上 JSON 即時排版、上色並檢查語法，錯誤會指出第幾行第幾個字元。可選縮排、依鍵排序或壓成一行；數字與字串保持原本的寫法。</div>
        </div>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="foot"><code>json_format/</code></div>
    </div>

    <div class="card">
      <div class="row">
        <div class="icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 6v3M9 6v3M15 6v3M19 6v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 12v8M8.5 16.5L12 20l3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="body">
          <a class="main" href="./jsonString_to_json/">JSON 字串轉 JSON</a>
          <div class="desc">把被跳脫成字串的 JSON（<code>"{\"age\":40.0}"</code>）解回來並排版。多跳脫幾層、開頭多帶到鍵名或冒號都能處理，也可以把值裡面的 JSON 字串一併展開。</div>
        </div>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="foot"><code>jsonString_to_json/</code></div>
    </div>

  </div>

  <footer>排版選項會記在這台裝置的瀏覽器裡，貼上的內容不會。</footer>

</div>

<script>
(function () {
  'use strict';
  // file:// 下瀏覽器不會自動載入目錄裡的 index.html，本機直接開檔時把結尾是 / 的相對連結補上
  if (location.protocol === 'file:') {
    document.querySelectorAll('a[href^="./"],a[href^="../"]').forEach(function (a) {
      var href = a.getAttribute('href');
      if (href.slice(-1) === '/') a.setAttribute('href', href + 'index.html');
    });
  }
})();
</script>
</body>
</html>
